function prof(){A.innerHTML=`<div class="t">Ficha da perita</div><div class="cd"><small>Seu nome</small><br><input id="nm" value="${PR.n}" maxlength="16" placeholder="Digite seu nome"></div><div class="cd"><small>Avatar</small><div class="row">${AV.map(a=>`<button class="av ${PR.av==a?'on':''}" onclick="PR.n=$('#nm').value;PR.av='${a}';prof()">${ic(a)}</button>`).join('')}</div></div><div class="cd"><small>Especialidade: acelera análises dessa área e rende +5 pontos</small>${Object.keys(ESP).map(k=>`<button class="opt ${PR.esp==k?'on':''}" onclick="PR.n=$('#nm').value;PR.esp='${k}';prof()">${ESP[k]}</button>`).join('')}</div><button onclick="PR.n=$('#nm').value||'Perita';menu()">Entrar na delegacia</button>`}
function menu(){const n=P.filter(x=>x!=null).length,rk=n<2?'Estagiária':n<3?'Perita Júnior':n<5?'Perita Sênior':'Perita-Chefe';
A.innerHTML=`<div class="cd row" onclick="prof()"><div class="ico">${ic(PR.av)}</div><div><b>${PR.n}</b><br><small>${rk} · ${ESP[PR.esp]} · ${n}/${CS.length} casos resolvidos</small></div></div><div class="t">Casos abertos</div>`+CS.map((c,i)=>`<div class="cd cs ${P[i]!=null?'dn':''}" onclick="dos(${i})">${ph(c.ic,'CASO 0'+(i+1))}<div><b>${c.t}</b>${P[i]!=null?`<span class="ck">${ic('check')}</span>`:''}<br><small>${c.loc} · Vítima: ${c.vic}</small><br>${c.sp.map(k=>`<span class="tg">${ESP[k]}</span>`).join('')}<br><small>${c.d}${P[i]!=null?' · Nota: '+P[i]:''}</small></div></div>`).join('')}
function dos(i){const c=CS[i];A.innerHTML=`<button class="alt" onclick="menu()">‹ Casos</button><div class="cd">${ph(c.ic,'CASO 0'+(i+1),'lg')}<div class="t">${c.t}</div><p><i>${c.tg}</i></p><small>Local: ${c.loc}<br>Vítima: ${c.vic}<br>Dificuldade: ${c.d}<br>${c.it.length} evidências · ${c.su.length} suspeitos<br>Perícias: ${c.sp.map(k=>ESP[k]).join(', ')}</small>${c.sp.includes(PR.esp)?'<p class="ok">Sua especialidade ajuda neste caso.</p>':''}${P[i]!=null?'<p class="ok">Caso concluído. Nota: '+P[i]+'</p>':''}</div><button onclick="start(${i})">Aceitar caso</button>`}
async function start(i){C=CS[i];G={i,found:{},an:{},bn:{},asked:{},log:{},gl:false,sc:100,tab:'cena',lx:'50%',ly:'50%',msg:'Coloque as luvas e arraste o dedo para iluminar a cena.'};
 A.innerHTML=`<div class="ph"><div class="bar">Delegado Moreira<br><small>online</small></div><div id="bx" class="bx"></div></div><p><button id="go" style="display:none" onclick="hub()">Ir à cena</button></p>`;
 for(const m of C.br)await say($('#bx'),m.replace('{n}',PR.n));$('#go').style.display='block'}
function hub(t){if(t)G.tab=t;const T={cena:'Cena',con:'Conversas',lab:'Lab',acu:'Acusar'};
 A.innerHTML=`<div class="hd"><span>${C.t} · ${PR.n}</span><span>Pontos: ${G.sc}</span></div><div class="tabs">${Object.keys(T).map(k=>`<button class="${k==G.tab?'on':''}" onclick="hub('${k}')">${T[k]}</button>`).join('')}</div><div id="v"></div>`;
 ({cena,con,lab,acu})[G.tab]()}
function cena(){const v=$('#v');
 v.innerHTML=`<div class="sc" id="sc" style="--x:${G.lx};--y:${G.ly}">${C.it.map(i=>`<button class="it ${G.found[i[0]]?'dn':''}" style="left:${i[3]}%;top:${i[4]}px" onclick="pick('${i[0]}')">${ic(i[1])}</button>`).join('')}<div class="dk"></div></div><div class="msg">${G.msg}</div><button class="alt" onclick="G.gl=!G.gl;G.msg=G.gl?'Luvas colocadas.':'Luvas removidas.';cena()">Luvas: ${G.gl?'ON':'OFF'}</button>`;
 const s=$('#sc');s.onpointermove=s.onpointerdown=e=>{const r=s.getBoundingClientRect();G.lx=e.clientX-r.left+'px';G.ly=e.clientY-r.top+'px';s.style.setProperty('--x',G.lx);s.style.setProperty('--y',G.ly)}}
function pick(id){const i=C.it.find(x=>x[0]==id);if(G.found[id])return;G.found[id]=1;
 if(!G.gl){G.sc-=10;G.msg='Sem luvas! Prova contaminada (−10): '+i[2]}else G.msg='Coletado: '+i[2];beep();hub('cena')}
function con(){$('#v').innerHTML=C.su.map(s=>{const n=s[3].filter((q,i)=>G.asked[s[0]+i]).length;return `<div class="cd row" onclick="chat('${s[0]}')"><div class="ico">${ic('phone')}</div><div><b>${s[1]}</b><br><small>${s[2]} · ${n}/${s[3].length} respostas</small></div></div>`}).join('')}
function chat(id){const s=C.su.find(x=>x[0]==id);$('#v').innerHTML=`<button class="alt" onclick="hub('con')">‹ Voltar</button><div class="ph"><div class="bar">${s[1]}<br><small>online · ${s[2]}</small></div><div id="bx" class="bx"></div></div><div id="qs"></div>`;
 (G.log[id]||[]).forEach(m=>add($('#bx'),m[0],m[1]));qb(id)}
function qb(id){const Q=C.su.find(x=>x[0]==id)[3],lk=new Set();Q.forEach(q=>(q[3]||[]).forEach(j=>lk.add(j)));
 const h=Q.map((q,i)=>{if(G.asked[id+i])return'';if(lk.has(i)&&!Q.some((p,k)=>G.asked[id+k]&&(p[3]||[]).includes(i)))return'';const b=q[2]&&!G.an[q[2]];return `<button class="opt" ${b?'disabled':''} onclick="ask('${id}',${i})">${b?'Requer prova analisada: ':''}${q[0]}</button>`}).join('');
 $('#qs').innerHTML=h||'<small>Sem mais perguntas por enquanto.</small>'}
async function ask(id,i){const q=C.su.find(x=>x[0]==id)[3][i],bx=$('#bx');G.asked[id+i]=1;$('#qs').innerHTML='';(G.log[id]=G.log[id]||[]).push(['r',q[0]]);add(bx,'r',q[0]);await say(bx,q[1]);G.log[id].push(['l',q[1]]);qb(id)}
function lab(){const f=C.it.filter(i=>G.found[i[0]]);$('#v').innerHTML=f.length?f.map(i=>`<div class="cd" id="L${i[0]}"><div class="row">${ph(i[1],'FOTO '+i[0].toUpperCase().slice(0,4))}<div><b>${i[2]}</b><br><small>Perícia: ${ESP[i[6]]}</small></div></div>${G.an[i[0]]?`<p class="ok">${i[5]}${G.bn[i[0]]?'<br><small>Especialidade: análise rápida (+5)</small>':''}</p>`:`<button onclick="an('${i[0]}')">Analisar</button>`}</div>`).join(''):'<div class="cd">Nenhuma evidência coletada ainda.</div>'}
async function an(id){const i=C.it.find(x=>x[0]==id),m=i[6]==PR.esp;$('#L'+id).querySelector('button').outerHTML=`<div class="pg"><i style="animation-duration:${m?.5:1.8}s"></i></div>`;await sl(m?600:1900);G.an[id]=1;if(m){G.sc+=5;G.bn[id]=1}beep();hub('lab')}
function acu(){$('#v').innerHTML='<div class="cd">Quem cometeu o crime?</div>'+C.su.map(s=>`<button class="opt" onclick="acc('${s[0]}')">${s[1]} · ${s[2]}</button>`).join('')}
function acc(id){if(id!=C.w){G.sc=Math.max(0,G.sc-25);alert('O juiz rejeitou a acusação (−25). Reúna mais provas.');return hub('acu')}
 const r=G.sc>=95?'Perita-Chefe':G.sc>=70?'Perita Sênior':'Perita Júnior';P[G.i]=Math.max(P[G.i]||0,G.sc);
 A.innerHTML=`<div class="cd"><div class="t">Caso resolvido</div><p>${C.end}</p><div class="big">${G.sc}</div><p style="text-align:center">${PR.n}: ${r}</p></div>${G.i<CS.length-1?`<button onclick="start(${G.i+1})">Próximo caso</button>`:''}<button class="alt" onclick="menu()">Casos</button>`}
splash();
</script></body></html>
